services:
  # 1. Frontend (React + Vite) static site
  - type: web
    name: nova-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://nova-scrubber-service.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Scrubber service (FastAPI)
  - type: web
    name: nova-scrubber-service
    runtime: python
    plan: free
    rootDir: scrubber
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_TOKEN
        sync: false
      - key: GROQ_TOKEN
        sync: false
      - key: OPEN_TOKEN
        sync: false