services:
  # 1. Frontend (React + Vite) - Always Free on Render Static Sites
  - type: web
    name: nova-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  

  # 3. Scrubber Service (FastAPI) - Free Web Service
  - type: web
    name: nova-scrubber-service
    env: python
    plan: free
    rootDir: scrubber
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false

  